<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — Página no encontrada</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;
padding:24px;background:#0a0e1a;color:#e2e8f0;text-align:center;
font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.bg{position:fixed;inset:0;pointer-events:none;background:
radial-gradient(60% 50% at 50% 42%,rgba(99,102,241,.18),transparent 70%),
repeating-linear-gradient(0deg,rgba(148,163,184,.05) 0 1px,transparent 1px 64px),
repeating-linear-gradient(90deg,rgba(148,163,184,.05) 0 1px,transparent 1px 64px)}
main{position:relative;animation:e .6s ease-out both}
.w{font-weight:700;font-size:1.15rem;letter-spacing:-.02em;margin-bottom:2rem}
.w b{color:#6366f1}
h1{margin:0;font-weight:800;line-height:.9;letter-spacing:-.06em;
font-size:clamp(5rem,22vw,11rem);
background:linear-gradient(100deg,#60a5fa,#6366f1,#a855f7,#f43f5e,#60a5fa);
background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
color:transparent;animation:f 9s linear infinite}
p{margin:.9rem 0 1.9rem;color:#94a3b8;font-size:1.05rem}
a{display:inline-block;padding:.72rem 1.6rem;border-radius:.6rem;text-decoration:none;
color:#e2e8f0;border:1px solid #334155;background:rgba(148,163,184,.06);
transition:transform .2s,border-color .2s,background .2s}
a:hover,a:focus-visible{transform:translateY(-2px);border-color:#6366f1;
background:rgba(99,102,241,.14)}
@keyframes f{to{background-position:300% 0}}
@keyframes e{from{opacity:0;transform:translateY(14px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="bg"></div>
<main>
<div class="w">SG<b>.dev</b></div>
<h1>404</h1>
<p>Esta página no existe.</p>
<a href="/">Volver al inicio</a>
</main>
</body></html>
